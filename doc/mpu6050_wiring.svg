<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Nucleo-F446RE &#8596; MPU6050 (I2C1)</text>

  <!-- Nucleo board -->
  <rect x="40" y="80" width="260" height="330" rx="10" fill="#0f6db8" stroke="#08477a" stroke-width="2"/>
  <text x="170" y="108" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">STM32 Nucleo-F446RE</text>

  <!-- Nucleo pin pads -->
  <g font-size="14" fill="#ffffff">
    <!-- 3.3V -->
    <rect x="250" y="150" width="14" height="14" fill="#ffd54a"/>
    <text x="240" y="161" text-anchor="end">3.3V</text>
    <!-- GND -->
    <rect x="250" y="200" width="14" height="14" fill="#9e9e9e"/>
    <text x="240" y="211" text-anchor="end">GND</text>
    <!-- PB6 -->
    <rect x="250" y="250" width="14" height="14" fill="#7fe07f"/>
    <text x="240" y="261" text-anchor="end">PB6 (SCL)</text>
    <!-- PB7 -->
    <rect x="250" y="300" width="14" height="14" fill="#ff8a65"/>
    <text x="240" y="311" text-anchor="end">PB7 (SDA)</text>
  </g>

  <!-- MPU6050 board -->
  <rect x="540" y="150" width="220" height="180" rx="10" fill="#2f9e44" stroke="#1e6b2e" stroke-width="2"/>
  <text x="650" y="178" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MPU6050</text>
  <text x="650" y="196" font-size="11" text-anchor="middle" fill="#e8f5e9">accel + gyro module</text>

  <!-- MPU6050 pin pads -->
  <g font-size="14" fill="#ffffff">
    <rect x="536" y="220" width="14" height="14" fill="#ffd54a"/>
    <text x="560" y="231">VCC</text>

    <rect x="536" y="250" width="14" height="14" fill="#9e9e9e"/>
    <text x="560" y="261">GND</text>

    <rect x="536" y="280" width="14" height="14" fill="#7fe07f"/>
    <text x="560" y="291">SCL</text>

    <rect x="536" y="310" width="14" height="14" fill="#ff8a65"/>
    <text x="560" y="321">SDA</text>
  </g>

  <!-- Wires -->
  <!-- VCC: Nucleo 3.3V (257,157) -> MPU VCC (543,227) -->
  <path d="M264,157 C400,157 400,227 536,227" stroke="#ffd54a" stroke-width="3" fill="none"/>
  <!-- GND -->
  <path d="M264,207 C420,207 420,257 536,257" stroke="#9e9e9e" stroke-width="3" fill="none"/>
  <!-- SCL: PB6 -> SCL -->
  <path d="M264,257 C440,257 440,287 536,287" stroke="#4caf50" stroke-width="3" fill="none"/>
  <!-- SDA: PB7 -> SDA -->
  <path d="M264,307 C460,307 460,317 536,317" stroke="#ff5722" stroke-width="3" fill="none"/>

  <!-- Legend / notes -->
  <g font-size="13" fill="#1a1a1a">
    <text x="40" y="440">Wire colors match function, not a strict convention:</text>
    <text x="40" y="460">yellow = power &#183; gray = ground &#183; green = SCL &#183; orange = SDA. Add 4.7k&#8486; pull-ups on SCL/SDA only if your module lacks its own.</text>
  </g>
</svg>
